[package]
name = "dprint-plugin-bird"
version = "0.0.1"
publish = false
authors = [
  "bird-chinese-community",
  "BIRD Chinese Community <rust-dev@birdcc.link>",
]
edition = "2021"
license = "GPL-3.0+"
description = "BIRD config formatter plugin for dprint"
repository = "https://github.com/bird-chinese-community/BIRD-LSP"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
wasm = ["dprint-core/wasm", "serde_json"]

[dependencies]
anyhow = "1.0.95"
dprint-core = { version = "0.67.4", features = ["formatting"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
tree-sitter = "=0.27.1"
tree-sitter-language = "=0.1.9"

[build-dependencies]
cc = "1.2.48"

[dev-dependencies]
pretty_assertions = "1.4.1"
