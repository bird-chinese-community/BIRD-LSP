name: Cross Platform Compat

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cross-platform-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-test-graph:
    name: Workspace test graph
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required submodules
        run: git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar refer/vscode-bird2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - name: Check formatting
        run: pnpm exec turbo run format --concurrency=1 -- --check

  native-smoke:
    name: Native Smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
          - name: linux-arm64
            runs_on: blacksmith-4vcpu-ubuntu-2404-arm
          - name: macos-arm64
            runs_on: macos-latest
          - name: windows-amd64
            runs_on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: wasm32-unknown-unknown
      - name: Select LLVM Clang for macOS WASM builds
        if: runner.os == 'macOS'
        run: |
          CLANG_PATH="$(brew --prefix llvm@20)/bin/clang"
          "$CLANG_PATH" --version
          "$CLANG_PATH" --target=wasm32-unknown-unknown -x c -c /dev/null -o "$RUNNER_TEMP/wasm-compiler-check.o"
          echo "CC_wasm32_unknown_unknown=$CLANG_PATH" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @birdcc/formatter lint
      - run: pnpm --filter @birdcc/cli... build
      - run: pnpm --filter @birdcc/formatter typecheck
      - run: pnpm --filter @birdcc/formatter test
      - run: node tools/ci/smoke-cli-lint-fmt.mjs

  bird-parse-docker:
    name: Bird Parse Docker (${{ matrix.platform_tag }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: linux-amd64
            runs_on: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            platform_tag: linux-arm64
            runs_on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @birdcc/cli... build
      - run: node tools/ci/smoke-cli-lint-fmt.mjs
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build BIRD2 image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "birdcc/bird2-ci:${{ matrix.platform_tag }}" \
            docker/bird2
      - name: Validate config via bird -p
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD/.tmp/ci-bird-smoke:/work:ro" \
            --entrypoint /usr/sbin/bird \
            "birdcc/bird2-ci:${{ matrix.platform_tag }}" \
            -p -c /work/bird.conf
