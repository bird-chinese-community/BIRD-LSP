name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.18.3"
  NODE_VERSION: "24"

jobs:
  prek:
    name: Pre-check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:status --since origin/main
        env:
          TEGAMI_VERSION_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/tegami-version-packages' && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
      - uses: dtolnay/rust-toolchain@stable
      - run: node --test tools/test/release-status.test.mjs
      - name: Validate release versioning in an isolated worktree
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/release-version-tmp
        run: |
          mkdir -p "$TMPDIR"
          git worktree add --detach .tmp/release-version-check HEAD
          pnpm --dir .tmp/release-version-check install --frozen-lockfile --ignore-scripts
          pnpm --dir .tmp/release-version-check release:version
      - name: Remove release validation workspace
        if: always()
        run: |
          if [ -d .tmp/release-version-check ]; then
            release_git_dir=$(git -C .tmp/release-version-check rev-parse --absolute-git-dir)
            git worktree remove --force .tmp/release-version-check
            test ! -e "$release_git_dir"
          fi
          rm -rf .tmp/release-version-tmp
          test ! -e .tmp/release-version-check
          test ! -e .tmp/release-version-tmp
          git worktree list --porcelain
      - uses: j178/prek-action@v1
        with:
          extra-args: --all-files

  parser:
    name: Parser (grammar verification)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @birdcc/parser run build:grammar
      - name: Verify tracked files unchanged after grammar generation
        run: git diff --exit-code
      - run: pnpm --filter @birdcc/parser run lint
      - run: pnpm --filter @birdcc/parser run test
      - run: pnpm --filter @birdcc/parser run build
      - run: pnpm --filter @birdcc/parser run typecheck
      - run: pnpm --filter @birdcc/parser run format

  turbo:
    name: Full build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      - name: Check formatting
        run: pnpm exec turbo run format --concurrency=1 -- --check
      - name: Commitlint range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # base.sha can lag behind the base branch; lint only commits it lacks.
            FROM="origin/${{ github.base_ref }}"
          else
            FROM="${{ github.event.before }}"
          fi

          if ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            FROM="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")"
          fi

          pnpm exec commitlint --config commitlint.config.cjs --from "$FROM" --to "${{ github.sha }}"

  coverage:
    name: Coverage
    needs: turbo
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: wasm32-unknown-unknown
      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - name: Upload coverage summaries
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: packages/@birdcc/*/coverage/coverage-summary.json
          if-no-files-found: error

  vscode-e2e-smoke:
    name: VS Code E2E smoke (${{ matrix.vscode }})
    needs: turbo
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.100.0", "stable"]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: wasm32-unknown-unknown
      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install native BIRD validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bird2
          echo /usr/sbin >> "$GITHUB_PATH"
      - run: pnpm --filter @birdcc/vscode... build
      - run: xvfb-run -a pnpm --filter @birdcc/vscode test:e2e

  vscode-pack-smoke:
    name: VS Code pack smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # The main extension bundles the dprint plugin, which builds to WASM.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bird2-extension-pack marketplace:package
      - run: pnpm --filter @birdcc/vscode marketplace:package

  # Gate check — all required jobs must pass before merging
  ci-ok:
    name: CI OK
    if: always()
    needs: [prek, parser, turbo, coverage, vscode-e2e-smoke, vscode-pack-smoke]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check all jobs
        run: |
          echo "prek: ${{ needs.prek.result }}"
          echo "parser: ${{ needs.parser.result }}"
          echo "turbo: ${{ needs.turbo.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          echo "vscode-e2e-smoke: ${{ needs.vscode-e2e-smoke.result }}"
          echo "vscode-pack-smoke: ${{ needs.vscode-pack-smoke.result }}"

          if [[ "${{ needs.prek.result }}" != "success" ]] || \
             [[ "${{ needs.parser.result }}" != "success" ]] || \
             [[ "${{ needs.turbo.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.vscode-e2e-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.vscode-pack-smoke.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI jobs passed!"
