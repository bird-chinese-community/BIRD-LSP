name: Publish VS Code Extensions

on:
  push:
    branches:
      - main
    # Manifest-only edits may retrigger this workflow; publish commands use --skip-duplicate.
    paths:
      - packages/@birdcc/vscode/package.json
      - packages/@birdcc/vscode-pack/package.json
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish main extension to VS Code Marketplace"
        required: true
        default: true
        type: boolean
      publish_openvsx:
        description: "Publish main extension to Open VSX"
        required: true
        default: true
        type: boolean
      publish_pack_marketplace:
        description: "Publish extension pack to VS Code Marketplace"
        required: true
        default: true
        type: boolean
      publish_pack_openvsx:
        description: "Publish extension pack to Open VSX"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create or update the versioned GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      extension-version: ${{ steps.release.outputs.extension_version }}
      pack-version: ${{ steps.release.outputs.pack_version }}
      release-tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Validate extension release metadata
        run: node tools/vscode-release-info.mjs

  package-vsix:
    needs: release-info
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar refer/vscode-bird2
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar refer/vscode-bird2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @birdcc/vscode marketplace:package
      - run: pnpm --filter bird2-extension-pack marketplace:package
      - uses: actions/upload-artifact@v4
        with:
          name: bird2-lsp-vsix
          path: packages/@birdcc/vscode/release/bird2-lsp.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bird2-extension-pack-vsix
          path: packages/@birdcc/vscode-pack/release/bird2-extension-pack.vsix
          if-no-files-found: error

  publish-vscode-marketplace:
    needs: package-vsix
    if: ${{ github.event_name == 'push' || inputs.publish_marketplace }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bird2-lsp-vsix
          path: packages/@birdcc/vscode/release
      - run: pnpm --filter @birdcc/vscode marketplace:publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VS_PUBLISH_TOKEN }}
      - name: Verify VS Code Marketplace publication
        run: >-
          node packages/@birdcc/vscode/scripts/verify-marketplace.mjs
          --registry vscode
          --manifest packages/@birdcc/vscode/package.json
          --extension-name bird2-lsp

  publish-openvsx:
    needs: package-vsix
    if: ${{ github.event_name == 'push' || inputs.publish_openvsx }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bird2-lsp-vsix
          path: packages/@birdcc/vscode/release
      - run: pnpm --filter @birdcc/vscode marketplace:publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PUBLISH_TOKEN }}
      - name: Verify Open VSX publication
        run: >-
          node packages/@birdcc/vscode/scripts/verify-marketplace.mjs
          --registry openvsx
          --manifest packages/@birdcc/vscode/package.json
          --extension-name bird2-lsp

  publish-pack-vscode-marketplace:
    needs: package-vsix
    if: ${{ github.event_name == 'push' || inputs.publish_pack_marketplace }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bird2-extension-pack-vsix
          path: packages/@birdcc/vscode-pack/release
      - run: pnpm --filter bird2-extension-pack marketplace:publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VS_PUBLISH_TOKEN }}
      - name: Verify VS Code Marketplace publication
        run: >-
          node packages/@birdcc/vscode/scripts/verify-marketplace.mjs
          --registry vscode
          --manifest packages/@birdcc/vscode-pack/package.json
          --extension-name bird2-extension-pack

  publish-pack-openvsx:
    needs: package-vsix
    if: ${{ github.event_name == 'push' || inputs.publish_pack_openvsx }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bird2-extension-pack-vsix
          path: packages/@birdcc/vscode-pack/release
      - run: pnpm --filter bird2-extension-pack marketplace:publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PUBLISH_TOKEN }}
      - name: Verify Open VSX publication
        run: >-
          node packages/@birdcc/vscode/scripts/verify-marketplace.mjs
          --registry openvsx
          --manifest packages/@birdcc/vscode-pack/package.json
          --extension-name bird2-extension-pack

  github-release:
    name: Create versioned VSIX release
    needs:
      - release-info
      - package-vsix
    if: ${{ github.event_name == 'push' || inputs.create_github_release }}
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bird2-lsp-vsix
          path: ./vsix
      - uses: actions/download-artifact@v4
        with:
          name: bird2-extension-pack-vsix
          path: ./vsix
      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: BIRD2 LSP v${{ needs.release-info.outputs.extension-version }}
          generate_release_notes: true
          files: |
            ./vsix/bird2-lsp.vsix
            ./vsix/bird2-extension-pack.vsix
          body: |
            ## VS Code Extensions

            | Extension | Version | File |
            |---|---:|---|
            | BIRD2 LSP | `${{ needs.release-info.outputs.extension-version }}` | `bird2-lsp.vsix` |
            | BIRD2 Extension Pack | `${{ needs.release-info.outputs.pack-version }}` | `bird2-extension-pack.vsix` |

            ### Install manually

            ```bash
            code --install-extension bird2-lsp.vsix
            code --install-extension bird2-extension-pack.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
