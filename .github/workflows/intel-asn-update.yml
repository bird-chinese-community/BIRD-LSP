name: Intel ASN Database Update (Weekly)

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build DB but skip publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-asn-db:
    name: Update ASN Database
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build ASN database
        working-directory: packages/@birdcc/intel
        run: pnpm build:db

      - name: Verify database
        working-directory: packages/@birdcc/intel
        run: |
          if [ ! -f db/asn-db.bin.gz ]; then
            echo "::error::Database file not found"
            exit 1
          fi
          SIZE=$(stat -c%s db/asn-db.bin.gz 2>/dev/null || stat -f%z db/asn-db.bin.gz)
          echo "Database size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Database file too small ($SIZE bytes), likely corrupted"
            exit 1
          fi
          echo "✓ Database verified"

      - name: Record the database update
        run: node tools/intel-release-note.mjs

      - name: Build package
        run: pnpm --filter @birdcc/intel build

      - name: Open the database update pull request
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feat/weekly-asn-database
          commit-message: "chore(intel): Update ASN database"
          title: "chore(intel): Update ASN database"
          sign-commits: true
          add-paths: |
            packages/@birdcc/intel/db/
            .tegami/weekly-intel-database.md
          body: |
            Refresh the bundled ASN intelligence data. The native Tegami
            record includes this update in the next package release.

      - uses: actions/upload-artifact@v4
        with:
          name: asn-db-${{ github.run_id }}
          path: packages/@birdcc/intel/db/asn-db.bin.gz
          retention-days: 30
