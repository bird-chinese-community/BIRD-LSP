name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: "Names from the Tegami publish lock (comma-separated; empty selects all)"
        default: ""
        type: string
      dry_run:
        description: "Validate the publish lock without publishing"
        required: true
        default: true
        type: boolean
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        run: |
          git submodule sync -- refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar
          git submodule update --init --depth 1 refer/BIRD-source-code refer/BIRD-tm-language-grammar refer/BIRD2-vim-grammar

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - run: pnpm install --frozen-lockfile

      # Run full CI checks before any release action
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Configure release commit author
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Version or publish the release plan
        if: github.event_name == 'push'
        run: |
          mkdir -p .tmp
          pnpm tegami ci
        env:
          TEGAMI_GITHUB: "1"
          GITHUB_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.tmp
      - name: Publish selected locked packages
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_PACKAGES: ${{ inputs.packages }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(publish)
          if [ "$RELEASE_DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          if [ -n "$RELEASE_PACKAGES" ]; then
            IFS=, read -r -a packages <<< "$RELEASE_PACKAGES"
            args+=("${packages[@]}")
          fi
          pnpm tegami "${args[@]}"
